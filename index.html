<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f4ef">
<title>When Can I Leave?</title>
<style>
  :root{
    --bg:#f5f4ef; --card:rgba(255,255,255,.92); --ink:#1c1c1a; --muted:#6b6a64; --line:#e4e2da;
    --accent:#c2562f; --accent-soft:#f6e3da; --ok:#2f7d4f; --ok-soft:#dcefe3;
    --warn:#b7791f; --warn-soft:#fbefd5; --head:#1c1c1a; --head-muted:#6b6a64;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#151513; --card:rgba(31,31,28,.9); --ink:#f1efe8; --muted:#9b998f; --line:#34332e;
      --accent:#e07a52; --accent-soft:#3a251c; --ok:#5cc489; --ok-soft:#1b3326;
      --warn:#f0b54a; --warn-soft:#3a2c12; --head:#f1efe8; --head-muted:#b9b7ad; }
  }
  /* Thursday: a different accent for the last day of the week */
  body.thu{ --accent:#6b4fd8; --accent-soft:#e9e3fb; }
  @media (prefers-color-scheme: dark){ body.thu{ --accent:#a993ff; --accent-soft:#2a2342; } }

  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);background-attachment:fixed;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  main{max-width:440px;margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 28px);}
  h1{font-size:22px;margin:4px 0 2px;font-weight:700;letter-spacing:-.01em;color:var(--head);transition:color .6s}
  .sub{color:var(--head-muted);font-size:14px;margin:0 0 18px;transition:color .6s}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .row{display:flex;gap:10px}
  input[type=time]{flex:1;min-width:0;font-size:30px;font-weight:600;padding:10px 12px;border-radius:12px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit;-webkit-appearance:none;appearance:none}
  button{font:inherit;font-weight:600;font-size:16px;border:0;border-radius:12px;padding:0 18px;
    background:var(--accent);color:#fff;cursor:pointer}
  button:active{transform:scale(.97)}
  .result{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .result + .result{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
  .tag{font-size:13px;color:var(--muted);font-weight:600}
  .big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:2px}
  .pill{font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;white-space:nowrap;
    background:var(--accent-soft);color:var(--accent)}
  .pill.window{background:var(--warn-soft);color:var(--warn)}
  .pill.done{background:var(--ok-soft);color:var(--ok)}

  /* Status: working -> leave window -> full day done */
  .status{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:10px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
  .status.window .dot{background:var(--warn)}
  .status.done .dot{background:var(--ok)}
  .status small{font-weight:500;color:var(--muted);font-size:13px}
  .bar{position:relative;height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
  .bar > .fill{height:100%;width:0;background:var(--accent);transition:width .4s,background .4s}
  .bar > .fill.window{background:var(--warn)}
  .bar > .fill.done{background:var(--ok)}
  .bar > .mark{position:absolute;top:0;bottom:0;width:2px;background:var(--card)}
  .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}

  .empty{color:var(--muted);font-size:15px;text-align:center;padding:10px 0}
  .msg{font-size:16px;line-height:1.5;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .actions{display:flex;gap:10px}
  .actions > *{flex:1;height:48px;display:flex;align-items:center;justify-content:center;text-decoration:none;border-radius:12px;font-weight:600;font-size:16px}
  .btn-wa{background:#25d366;color:#08331a}
  #copy.copied{background:var(--ok)}

  /* Week strip */
  .week{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .day{text-align:center;border-radius:12px;padding:8px 2px;background:var(--bg);border:1px solid var(--line)}
  .day .dn{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .day .t{font-size:13px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
  .day .t2{font-size:11.5px;color:var(--muted);margin-top:1px;font-variant-numeric:tabular-nums}
  .day.filled{background:var(--accent-soft);border-color:transparent}
  .day.filled .dn{color:var(--accent)}
  .day.today{outline:2px solid var(--accent);outline-offset:-2px}
  .day.missed .t{color:var(--muted)}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
    button:active{transform:none}
  }
</style>
</head>
<body>
<main>
  <h1>When can I leave?</h1>
  <p class="sub" id="sub">Enter your arrival time.</p>

  <div class="card">
    <label for="arr">Arrived at</label>
    <div class="row">
      <input id="arr" type="time" step="60">
      <button id="now" type="button">Now</button>
    </div>
  </div>

  <div class="card" id="out">
    <div class="empty">Pick an arrival time to see your leave times.</div>
  </div>

  <div class="card" id="progress" hidden>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Working</span></div>
    <div class="big" id="worked">0h 00m</div>
    <div class="bar"><div class="fill" id="fill"></div><div class="mark" id="mark"></div></div>
    <div class="meta"><span id="pct">0%</span><span>of 8h 30m</span></div>
  </div>

  <div class="card" id="share" hidden>
    <label>Message</label>
    <div class="msg" id="msg"></div>
    <div class="actions">
      <button id="copy" type="button">Copy</button>
      <a id="wa" class="btn-wa" href="#" target="_blank" rel="noopener">WhatsApp</a>
    </div>
  </div>

  <div class="card">
    <label id="weekLabel">This week</label>
    <div class="week" id="week"></div>
  </div>
</main>

<script>
  var FULL = 8*60 + 30, MIN = 8*60 + 15;
  var $ = function(id){ return document.getElementById(id); };
  var arr = $('arr'), out = $('out'), prog = $('progress'), shareCard = $('share');
  var msgEl = $('msg'), waEl = $('wa'), copyBtn = $('copy');
  var themeMeta = document.querySelector('meta[name=theme-color]');
  var darkMQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

  // ---------- storage (per device; may be unavailable) ----------
  function getItem(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function setItem(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
  function loadHist(){ try{ return JSON.parse(getItem('leave.hist') || '{}') || {}; }catch(e){ return {}; } }
  function saveHist(h){
    // keep ~6 weeks so storage never grows unbounded
    var keys = Object.keys(h).sort();
    while(keys.length > 45){ delete h[keys.shift()]; }
    setItem('leave.hist', JSON.stringify(h));
  }

  // ---------- time helpers ----------
  function pad(n){ return (n<10?'0':'') + n; }
  function fmt12(totalMin){
    var m = ((Math.round(totalMin) % 1440) + 1440) % 1440;
    var h = Math.floor(m/60), mm = m%60;
    return (h % 12 || 12) + ':' + pad(mm) + ' ' + (h >= 12 ? 'PM' : 'AM');
  }
  function fmtShort(totalMin){ return fmt12(totalMin).replace(' AM','').replace(' PM',''); }
  function dur(min){ var h = Math.floor(min/60), m = min%60; return (h ? h + 'h ' : '') + pad(m) + 'm'; }
  function nowMin(){ var d = new Date(); return d.getHours()*60 + d.getMinutes() + d.getSeconds()/60; }
  function parse(v){ if(!v) return null; var p = v.split(':'); return (+p[0])*60 + (+p[1]); }
  function dateKey(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }

  // ---------- sky: background follows progress through the workday ----------
  var SKY = {
    light: [ [0,'#9fd3f7','#eef7fd'], [.4,'#5fb2ee','#dff0fb'], [.75,'#f3c07e','#fdeedb'],
             [.97,'#ec7a50','#f8c795'], [1,'#6a5a9c','#e9907a'] ],
    dark:  [ [0,'#1d3550','#141c26'], [.4,'#1e4a72','#15212d'], [.75,'#5a3d22','#1d1712'],
             [.97,'#6b2e1c','#1f1410'], [1,'#2c2347','#191420'] ]
  };
  function hex2rgb(h){ return [parseInt(h.substr(1,2),16), parseInt(h.substr(3,2),16), parseInt(h.substr(5,2),16)]; }
  function mix(a, b, t){
    var x = hex2rgb(a), y = hex2rgb(b);
    return [0,1,2].map(function(i){ return Math.round(x[i] + (y[i]-x[i])*t); });
  }
  function rgb(c){ return 'rgb(' + c.join(',') + ')'; }
  function lum(c){ return (0.299*c[0] + 0.587*c[1] + 0.114*c[2]) / 255; }
  function skyAt(p){
    var stops = (darkMQ && darkMQ.matches) ? SKY.dark : SKY.light;
    p = Math.max(0, Math.min(1, p));
    for(var i = 1; i < stops.length; i++){
      if(p <= stops[i][0]){
        var a = stops[i-1], b = stops[i], t = (p - a[0]) / (b[0] - a[0]);
        return [mix(a[1], b[1], t), mix(a[2], b[2], t)];
      }
    }
    var l = stops[stops.length-1]; return [hex2rgb(l[1]), hex2rgb(l[2])];
  }
  function paintSky(p){
    var root = document.body.style;
    if(p === null){
      root.background = ''; root.removeProperty('--head'); root.removeProperty('--head-muted');
      themeMeta.setAttribute('content', (darkMQ && darkMQ.matches) ? '#151513' : '#f5f4ef');
      return;
    }
    var s = skyAt(p);
    root.background = 'linear-gradient(180deg,' + rgb(s[0]) + ' 0%,' + rgb(s[1]) + ' 70%)';
    root.backgroundAttachment = 'fixed';
    var lightHead = lum(s[0]) < 0.55;          // header text sits on the top colour
    root.setProperty('--head', lightHead ? '#ffffff' : '#1c1c1a');
    root.setProperty('--head-muted', lightHead ? 'rgba(255,255,255,.8)' : 'rgba(28,28,26,.7)');
    themeMeta.setAttribute('content', rgb(s[0]));
  }

  // ---------- week strip (Sun–Thu) ----------
  var DAYS = ['Sun','Mon','Tue','Wed','Thu'];
  function renderWeek(){
    var hist = loadHist(), today = new Date(), dow = today.getDay();
    var sunday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - dow);
    $('weekLabel').textContent = dow >= 5 ? 'Last week' : 'This week';
    var html = '';
    for(var i = 0; i < 5; i++){
      var d = new Date(sunday.getFullYear(), sunday.getMonth(), sunday.getDate() + i);
      var k = dateKey(d), a = parse(hist[k]);
      var isToday = i === dow, isPast = i < dow;
      var cls = 'day' + (a !== null ? ' filled' : '') + (isToday ? ' today' : '') +
                (a === null && isPast ? ' missed' : '');
      var body = a !== null
        ? '<div class="t">' + fmtShort(a) + '</div><div class="t2">→ ' + fmtShort(a + FULL) + '</div>'
        : '<div class="t">' + (isPast ? '—' : '·') + '</div><div class="t2">&nbsp;</div>';
      html += '<div class="' + cls + '"><div class="dn">' + DAYS[i] + '</div>' + body + '</div>';
    }
    $('week').innerHTML = html;
  }

  // ---------- Thursday ----------
  function applyWeekday(){
    var thu = new Date().getDay() === 4;
    document.body.classList.toggle('thu', thu);
    $('sub').textContent = thu ? 'Thursday. Last day of the week.' : 'Enter your arrival time.';
  }

  // ---------- main render ----------
  function render(){
    applyWeekday();
    renderWeek();
    var a = parse(arr.value);
    if(a === null){
      out.innerHTML = '<div class="empty">Pick an arrival time to see your leave times.</div>';
      prog.hidden = true; shareCard.hidden = true; paintSky(null); return;
    }

    var text = 'I arrived at ' + fmt12(a) + ' and will leave either at ' +
               fmt12(a + MIN) + ' or ' + fmt12(a + FULL) + '.';
    if(msgEl.textContent !== text){
      msgEl.textContent = text;
      waEl.href = 'https://wa.me/?text=' + encodeURIComponent(text);
    }
    shareCard.hidden = false;

    var n = nowMin(), worked = n - a;
    var live = worked >= 0 && worked < 16*60;   // arrival in the future or >16h ago: no live view
    var state = !live ? null : worked >= FULL ? 'done' : worked >= MIN ? 'window' : 'working';

    function row(title, target, kind){
      var left = Math.ceil(a + target - n), pill = '';
      if(live){
        if(left > 0) pill = '<span class="pill">in ' + dur(left) + '</span>';
        else pill = '<span class="pill ' + kind + '">' + (kind === 'done' ? 'Done ✓' : 'You can go') + '</span>';
      }
      return '<div class="result"><div><div class="tag">' + title + '</div>' +
             '<div class="big">' + fmt12(a + target) + '</div></div>' + pill + '</div>';
    }
    out.innerHTML = row('Earliest · 8h 15m', MIN, 'window') + row('Full day · 8h 30m', FULL, 'done');

    prog.hidden = !live;
    paintSky(live ? worked / FULL : null);
    if(!live) return;

    var w = Math.floor(worked);
    $('worked').textContent = dur(w);
    var pct = Math.min(100, worked / FULL * 100);
    var fill = $('fill');
    fill.style.width = pct + '%';
    fill.className = 'fill' + (state === 'working' ? '' : ' ' + state);
    $('mark').style.left = (MIN / FULL * 100) + '%';
    $('pct').textContent = Math.round(pct) + '%';

    var st = $('status');
    st.className = 'status' + (state === 'working' ? '' : ' ' + state);
    var label;
    if(state === 'working') label = 'Working <small>· ' + dur(Math.ceil(MIN - worked)) + ' to the leave window</small>';
    else if(state === 'window') label = 'Leave window <small>· you can go now, full day in ' + dur(Math.ceil(FULL - worked)) + '</small>';
    else label = 'Full day done ✓';
    $('statusText').innerHTML = label;
  }

  // ---------- input & actions ----------
  function save(){
    var hist = loadHist(), k = dateKey(new Date());
    if(arr.value) hist[k] = arr.value; else delete hist[k];
    saveHist(hist);
  }
  function setNow(){
    var d = new Date();
    arr.value = pad(d.getHours()) + ':' + pad(d.getMinutes());
    save(); render();
  }
  function copyText(text){
    if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise(function(resolve, reject){
      var t = document.createElement('textarea');
      t.value = text; t.setAttribute('readonly', '');
      t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      try{ document.execCommand('copy') ? resolve() : reject(); }catch(e){ reject(e); }
      document.body.removeChild(t);
    });
  }
  copyBtn.addEventListener('click', function(){
    copyText(msgEl.textContent).then(function(){
      copyBtn.textContent = 'Copied ✓'; copyBtn.classList.add('copied');
    }, function(){ copyBtn.textContent = 'Select & copy manually'; });
    setTimeout(function(){ copyBtn.textContent = 'Copy'; copyBtn.classList.remove('copied'); }, 2000);
  });
  $('now').addEventListener('click', setNow);
  arr.addEventListener('input', function(){ save(); render(); });
  arr.addEventListener('change', function(){ save(); render(); });
  if(darkMQ && darkMQ.addEventListener) darkMQ.addEventListener('change', render);

  // ---------- startup ----------
  (function migrate(){   // carry over today's value from the old single-day storage
    var oldDay = getItem('leave.day'), oldArr = getItem('leave.arr');
    if(oldDay && oldArr){
      var d = new Date(oldDay);
      if(!isNaN(d)){ var h = loadHist(); if(!h[dateKey(d)]) { h[dateKey(d)] = oldArr; saveHist(h); } }
      try{ localStorage.removeItem('leave.day'); localStorage.removeItem('leave.arr'); }catch(e){}
    }
  })();
  var todays = loadHist()[dateKey(new Date())];
  if(todays) arr.value = todays;
  render();
  setInterval(render, 20000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) render(); });
</script>
</body>
</html>
