<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>When Can I Leave?</title>
<style>
  :root{
    --bg:#f5f4ef; --card:#ffffff; --ink:#1c1c1a; --muted:#6b6a64; --line:#e4e2da;
    --accent:#c2562f; --accent-soft:#f6e3da; --ok:#2f7d4f; --ok-soft:#dcefe3;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#151513; --card:#1f1f1c; --ink:#f1efe8; --muted:#9b998f; --line:#2f2e2a;
      --accent:#e07a52; --accent-soft:#3a251c; --ok:#5cc489; --ok-soft:#1b3326; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  main{max-width:440px;margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 28px);}
  h1{font-size:22px;margin:4px 0 2px;font-weight:700;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:14px;margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .row{display:flex;gap:10px}
  input[type=time]{flex:1;min-width:0;font-size:30px;font-weight:600;padding:10px 12px;border-radius:12px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit;-webkit-appearance:none;appearance:none}
  button{font:inherit;font-weight:600;font-size:16px;border:0;border-radius:12px;padding:0 18px;
    background:var(--accent);color:#fff;cursor:pointer}
  button:active{transform:scale(.97)}
  .result{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .result + .result{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
  .tag{font-size:13px;color:var(--muted);font-weight:600}
  .big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:2px}
  .pill{font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;white-space:nowrap;
    background:var(--accent-soft);color:var(--accent)}
  .pill.done{background:var(--ok-soft);color:var(--ok)}
  .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
  .bar > div{height:100%;width:0;background:var(--accent);transition:width .4s}
  .bar > div.done{background:var(--ok)}
  .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
  .note{font-size:12.5px;color:var(--muted);line-height:1.5;margin:6px 4px 0}
  .empty{color:var(--muted);font-size:15px;text-align:center;padding:10px 0}
</style>
</head>
<body>
<main>
  <h1>When can I leave?</h1>
  <p class="sub">Enter your arrival time.</p>

  <div class="card">
    <label for="arr">Arrived at</label>
    <div class="row">
      <input id="arr" type="time" step="60">
      <button id="now" type="button">Now</button>
    </div>
  </div>

  <div class="card" id="out">
    <div class="empty">Pick an arrival time to see your leave times.</div>
  </div>

  <div class="card" id="progress" hidden>
    <label>Time worked so far</label>
    <div class="big" id="worked">0h 00m</div>
    <div class="bar"><div id="fill"></div></div>
    <div class="meta"><span id="pct">0%</span><span>of 8h 30m</span></div>
  </div>

</main>

<script>
  var FULL = 8*60 + 30, MIN = 8*60 + 15;
  var arr = document.getElementById('arr');
  var out = document.getElementById('out');
  var prog = document.getElementById('progress');

  function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v);}catch(e){ return null; } }

  function pad(n){ return (n<10?'0':'') + n; }
  function fmt12(totalMin){
    var m = ((totalMin % 1440) + 1440) % 1440;
    var h = Math.floor(m/60), mm = m%60;
    var ap = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12 || 12;
    return h12 + ':' + pad(mm) + ' ' + ap;
  }
  function dur(min){
    var h = Math.floor(min/60), m = min%60;
    return (h ? h + 'h ' : '') + pad(m) + 'm';
  }
  function nowMin(){ var d = new Date(); return d.getHours()*60 + d.getMinutes() + d.getSeconds()/60; }
  function parse(v){ if(!v) return null; var p = v.split(':'); return (+p[0])*60 + (+p[1]); }

  function render(){
    var a = parse(arr.value);
    if(a === null){
      out.innerHTML = '<div class="empty">Pick an arrival time to see your leave times.</div>';
      prog.hidden = true; return;
    }
    var n = nowMin();
    var worked = Math.max(0, n - a);
    // If "now" is earlier than arrival, assume the arrival entered is for a future/other day: no countdown.
    var live = n >= a && n - a < 16*60;

    function row(title, target){
      var left = Math.ceil(a + target - n);
      var pill = !live ? '' :
        left <= 0 ? '<span class="pill done">You can go ✓</span>'
                  : '<span class="pill">in ' + dur(left) + '</span>';
      return '<div class="result"><div><div class="tag">' + title + '</div>' +
             '<div class="big">' + fmt12(a + target) + '</div></div>' + pill + '</div>';
    }
    out.innerHTML = row('Earliest · 8h 15m', MIN) + row('Full day · 8h 30m', FULL);

    prog.hidden = !live;
    if(live){
      var w = Math.floor(worked);
      document.getElementById('worked').textContent = dur(w);
      var pct = Math.min(100, Math.round(worked / FULL * 100));
      var fill = document.getElementById('fill');
      fill.style.width = pct + '%';
      fill.className = worked >= MIN ? 'done' : '';
      document.getElementById('pct').textContent = pct + '%';
    }
  }

  function setNow(){
    var d = new Date();
    arr.value = pad(d.getHours()) + ':' + pad(d.getMinutes());
    save(); render();
  }
  function save(){
    var today = new Date().toDateString();
    store('leave.arr', arr.value); store('leave.day', today);
  }

  document.getElementById('now').addEventListener('click', setNow);
  arr.addEventListener('input', function(){ save(); render(); });
  arr.addEventListener('change', function(){ save(); render(); });

  // Restore today's arrival only (yesterday's value is useless).
  if(store('leave.day') === new Date().toDateString() && store('leave.arr')) arr.value = store('leave.arr');
  render();
  setInterval(render, 20000);
</script>
</body>
</html>
